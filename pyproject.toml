[project]
name = "nem-battery-arbitrage"
version = "0.1.0"
description = "Battery energy arbitrage optimiser for the Australian NEM: perfect hindsight vs rolling window"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "pulp>=2.9,<4",
    "requests>=2.31",
]

[project.scripts]
nem-battery = "nem_battery.cli:main"

[dependency-groups]
dev = ["ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nem_battery"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]
